.tw-row.nt.new{background:rgba(255,125,26,.07)}.tw-row.nt .nsn{color:var(--muted);font-size:.9rem}

/* ===== меню в верхней панели ===== */
header{flex-wrap:wrap;row-gap:.5rem}
header nav{position:static;left:auto;bottom:auto;transform:none;order:3;flex:1 1 100%;width:100%;max-width:100%;margin:0;padding:.28rem;gap:.25rem;justify-content:space-between;border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}

@media(max-width:600px){header nav{width:100%;padding:.22rem;gap:.15rem;border-radius:16px}header nav button{min-height:3.1rem;padding:.38rem .1rem;font-size:.66rem}header nav button span:first-child{font-size:1.2rem}}
main{padding-bottom:2rem}#app.tw{padding-bottom:6rem}footer{padding-bottom:1.2rem}
.toast{bottom:calc(1.2rem + env(safe-area-inset-bottom))}

.pw .eye:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

/* ===== свои иконки меню ===== */
header nav button .ic{display:block;width:1.6rem;height:1.6rem;object-fit:contain}
@media(max-width:600px){header nav button .ic{width:1.4rem;height:1.4rem}}

/* ===== меню: плитки-иконки, без обрезки текста ===== */
header nav{display:flex;flex-wrap:nowrap;justify-content:flex-start;gap:.3rem;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:.4rem;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,125,26,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.28)}
header nav::-webkit-scrollbar{display:none}
header nav button:first-child{margin-left:auto}header nav button:last-child{margin-right:auto}
header nav button{position:relative;flex:0 0 auto;min-width:4.6rem;min-height:0;padding:.35rem .7rem .55rem;gap:.28rem;border:0;border-radius:18px;background:none;box-shadow:none;color:var(--muted);font-size:.74rem;font-weight:600;line-height:1.1;white-space:nowrap;overflow:visible;scroll-snap-align:center;transition:color .18s,transform .18s}

header nav button.cur span:first-child{background:linear-gradient(150deg,rgba(255,125,26,.38),rgba(255,125,26,.1));border-color:rgba(255,125,26,.6);box-shadow:0 0 18px rgba(255,125,26,.28)}
header nav button.cur::after{content:"";position:absolute;left:50%;bottom:.14rem;width:1.1rem;height:2px;margin-left:-.55rem;border-radius:2px;background:var(--gold)}
header nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
@media(max-width:600px){header nav{padding:.3rem;gap:.15rem;border-radius:20px}header nav button{min-width:4.1rem;padding:.3rem .5rem .5rem;font-size:.68rem}header nav button span:first-child{width:2.1rem;height:2.1rem;font-size:1.05rem;border-radius:12px}header nav button .ic{width:1.45rem;height:1.45rem}}

@media(max-width:600px){header nav button{padding:.35rem .5rem}header nav button span:first-child{width:auto;height:auto}}

/* ===== v4: анимации, помощники со статистикой, новое меню, мобильная версия ===== */
:root{--ease:cubic-bezier(.22,.8,.3,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popOut{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
body.lock{overflow:hidden}

/* --- появление страниц и элементов --- */
#app>div>h1{animation:rise .6s var(--ease) backwards}
#app>div>.sub{animation:rise .6s var(--ease) .08s backwards}
#app:not(.wide) :is(.card,.stat,details,.tm,.fs,.rv,.dr){animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms + 80ms)}
#app:not(.wide) .door{animation:rise .6s var(--ease) backwards;animation-delay:calc(var(--i,0)*60ms + 120ms)}
.tag{animation:pop .32s var(--spring) both}

/* --- нажатие и наведение --- */
button{transition:transform .18s var(--ease),filter .18s,box-shadow .2s,background .2s,color .2s,border-color .2s}
@media(hover:hover){
  :is(.go,.acts>button,.fbtn,.tabs>button,.mdl .acts button,.hext button):hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,125,26,.16)}
  .card:hover{border-color:rgba(255,125,26,.3);transform:translateY(-1px)}
  .stat:hover{transform:translateY(-2px);border-color:rgba(255,125,26,.35)}
  .pk-i:hover{padding-left:.8rem}
  .pick button:hover{transform:scale(1.2)}
}
button:active:not(:disabled){transform:scale(.96)}
.card,.stat{transition:transform .25s var(--ease),border-color .25s,background .25s}
.pk-i{transition:background .15s,color .15s,padding .2s var(--ease)}
.pk-i.on{background:rgba(255,125,26,.1)}
.pick button{transition:transform .2s var(--spring),color .2s}.pick button.on{animation:pop .35s var(--spring)}
.tabs button{transition:background .25s,color .25s,border-color .25s,transform .18s var(--ease)}
.rp{overflow:hidden}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);pointer-events:none;animation:ripple .6s ease-out forwards}
:is(.go,.fbtn,.acts>button:not(.ghost):not(.bad):not(.hold)) .rpl{background:#fff;opacity:.45}

/* --- окна, шторки, уведомления --- */
.bd.out{animation:fadeOut .17s ease forwards}.bd.out .mdl{animation:popOut .17s ease forwards}
.sheet-bd{animation:fadeIn .2s ease both}
.sheet-bd.hs .sheet{animation:sheetIn .38s var(--ease) both}
.sheet-bd.out{animation:fadeOut .2s ease forwards}.sheet-bd.out .sheet{animation:sheetOut .2s ease forwards}
#toasts{position:fixed;left:0;right:0;bottom:calc(1.2rem + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:0 .75rem;pointer-events:none}
#toasts .toast{position:relative;left:auto;bottom:auto;transform:none;animation:toastIn .38s var(--spring) both}
#toasts .toast.out{animation:toastOut .22s ease forwards}

/* --- форма заявки по шагам --- */
.form{padding:.3rem 1.15rem 1.15rem}
.fs{padding:1rem 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.fs-h{display:flex;align-items:center;gap:.6rem;font:1.02rem var(--font);letter-spacing:.03em;color:#ffe2c2}
.fs-h i{flex:none;display:grid;place-items:center;width:1.75rem;height:1.75rem;border-radius:50%;font:700 .8rem Georgia,serif;font-style:normal;color:#1a1305;background:linear-gradient(135deg,#ffc266,#e8721c);box-shadow:0 0 14px rgba(255,125,26,.3)}
.fs-h+*{margin-top:.55rem}.fs label{margin-top:.7rem}.fs-h+label{margin-top:.55rem}
.sk-tile{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:shim 1.2s linear infinite!important;color:transparent}.sk-tile span{color:transparent}
.trk{display:flex;gap:.3rem;margin:.55rem 0 .2rem}
.trk span{flex:1;position:relative;padding-top:.55rem;font-size:.66rem;color:#7c7366;text-align:center}
.trk span:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:9px;background:rgba(255,255,255,.1);transform-origin:left}
.trk span.on{color:var(--text)}.trk span.on:before{background:var(--gold);animation:grow .8s var(--ease) backwards}
.trk.waiting span.on:before{background:var(--hold)}.trk.closed span.on:before{background:var(--ok)}

/* --- инфо --- */
.step{display:flex;gap:.8rem;align-items:flex-start}
.sn{flex:none;display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;font:700 .9rem Georgia,serif;font-style:normal;color:#1a1305;background:linear-gradient(135deg,#ffc266,#e8721c)}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.25rem 0;min-height:2.2rem}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";flex:none;font-size:1.5rem;line-height:1;color:var(--gold);transition:transform .3s var(--spring)}
details{transition:border-color .25s,background .25s}
details[open]{border-color:rgba(255,125,26,.3);background:rgba(255,125,26,.04)}
details[open] summary:after{transform:rotate(45deg)}
details[open] p{animation:rise .35s var(--ease)}

/* --- помощники --- */
#app.v-team{max-width:62rem}
.tgrid{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(min(19rem,100%),1fr))}
.tm{position:relative;display:flex;align-items:center;gap:.85rem;width:100%;min-height:0;margin:0;padding:.9rem 1rem;text-align:left;font:400 1rem/1.4 Georgia,serif;color:var(--text);border:1px solid rgba(255,255,255,.08);border-radius:20px;background:linear-gradient(145deg,rgba(32,18,40,.9),rgba(17,10,24,.92));box-shadow:0 8px 24px rgba(0,0,0,.2);cursor:pointer;overflow:hidden}
.tm:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tmav{position:relative;overflow:visible;width:3.2rem;height:3.2rem;font-size:1.3rem}
.tm .rk{position:absolute;right:-.35rem;bottom:-.35rem;display:grid;place-items:center;min-width:1.3rem;height:1.3rem;border-radius:50%;font:700 .66rem Georgia,serif;font-style:normal;color:#1a1305;background:#ff9b2f;border:2px solid #1a0f24}
.tm.r1 .tmav{box-shadow:0 0 0 2px #ffc266,0 0 24px rgba(242,210,143,.45)}
.tm.r2 .tmav{box-shadow:0 0 0 2px #cfd6df,0 0 18px rgba(207,214,223,.3)}.tm.r2 .rk{background:#cfd6df}
.tm.r3 .tmav{box-shadow:0 0 0 2px #d39a6b,0 0 18px rgba(211,154,107,.3)}.tm.r3 .rk{background:#d39a6b}
.tmi{flex:1;min-width:0}
.tmn{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}.tmn b{font-size:1.06rem;overflow:hidden;text-overflow:ellipsis}
.tmr{margin-top:.15rem;font-size:.84rem}
.chev{flex:none;color:var(--muted);font-size:1.6rem;line-height:1;transition:transform .25s var(--ease),color .2s}
@media(hover:hover){.tm:hover{transform:translateY(-3px);border-color:rgba(255,125,26,.4);box-shadow:0 14px 34px rgba(0,0,0,.35)}.tm:hover .chev{transform:translateX(4px);color:var(--gold)}}
.tm.sk-card{pointer-events:none;cursor:default}
.hhead{display:flex;align-items:center;gap:.9rem;margin-top:.2rem}
.hav{width:4.2rem;height:4.2rem;font-size:1.8rem;box-shadow:0 0 0 4px rgba(255,125,26,.14),0 0 30px rgba(255,125,26,.28)}
.hnm{min-width:0}.hnm h2{margin:0 0 .2rem;font-size:1.5rem;overflow-wrap:anywhere}
.hrate{display:flex;align-items:center;flex-wrap:wrap;gap:.1rem;font-size:1rem}
.stats.hs{grid-template-columns:repeat(3,minmax(0,1fr));margin:.2rem 0}.stats.hs .stat span{font-size:1.6rem}
.hext h2{margin:1rem 0 .5rem}
.dist{display:grid;gap:.45rem}
.dr{display:grid;grid-template-columns:2.3rem 1fr 1.8rem;align-items:center;gap:.5rem;font-size:.82rem;color:var(--muted)}
.dr .bar{margin:0;height:8px}.dr .bar i{width:0;transition:width .9s var(--ease)}
.rv{margin-bottom:.45rem;padding:.7rem .85rem;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:rgba(255,255,255,.03);overflow-wrap:anywhere}
.sheet.hl .go{margin-top:.5rem}

/* --- обновление и маркет --- */
.warning-caption.live{color:var(--ok);animation:pulse 1.6s ease-in-out infinite}
.cvbar{height:8px;margin:.7rem 0 .2rem}.cvbar[hidden]{display:none}.cvbar i{transition:width 1s linear}
.soon{text-align:center;padding:2rem 1.2rem}
.chip-link{display:inline-block;margin-top:1rem;padding:.6rem 1.1rem;border:1px solid rgba(255,125,26,.35);border-radius:999px;color:var(--gold);font-size:.85rem;text-decoration:none;transition:background .2s,transform .2s var(--ease)}
.chip-link:hover{background:rgba(255,125,26,.12);transform:translateY(-2px)}

@media(min-width:821px){
  .sheet-bd.hs{align-items:center;padding:1rem}
  .sheet-bd.hs .sheet{width:min(100%,31rem);max-height:88dvh;border-radius:26px;border-bottom:1px solid rgba(255,255,255,.1)}

/* --- страницы: общий стиль --- */

.hw-fx i:nth-child(1){top:14%;animation-duration:24s,.32s}
